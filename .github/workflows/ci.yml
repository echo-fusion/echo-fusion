name: CI

on:
  push:
    branches:
      - main
      - blog
  pull_request:
    branches:
      - main
      - blog
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Validate composer.json
        run: composer validate

      - name: Create the project the way a user would (installs the framework from Packagist)
        run: composer install --no-progress --prefer-dist

      - name: Check code style
        run: composer cs-check

      - name: Run the tests
        run: composer test
